[workspace]
resolver = "3"
members = [
    "crates/remu-bus",
    "crates/remu-cli",
    "crates/remu-core",
    "crates/remu-corpus",
    "crates/remu-casegen",
    "crates/remu-cpu-arm",
    "crates/remu-cpu-avr",
    "crates/remu-cpu-mcs51",
    "crates/remu-cpu-msp430",
    "crates/remu-cpu-pic16",
    "crates/remu-cpu-riscv",
    "crates/remu-cpu-xtensa",
    "crates/remu-devices",
    "crates/remu-gdb",
    "crates/remu-image",
    "crates/remu-machines",
    "crates/remu-signals",
    "crates/remu-starlark",
    "crates/remu-trace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["Renvo Emulator contributors"]
repository = "https://github.com/tinyrange/renvo_emu"

[workspace.dependencies]
allocative = "0.3.4"
clap = { version = "4.5.46", features = ["derive"] }
hex = "0.4.3"
md-5 = "0.10.6"
object = { version = "0.39.1", default-features = false, features = ["read", "elf"] }
remu-bus = { path = "crates/remu-bus" }
remu-core = { path = "crates/remu-core" }
remu-corpus = { path = "crates/remu-corpus" }
remu-cpu-arm = { path = "crates/remu-cpu-arm" }
remu-cpu-avr = { path = "crates/remu-cpu-avr" }
remu-cpu-mcs51 = { path = "crates/remu-cpu-mcs51" }
remu-cpu-msp430 = { path = "crates/remu-cpu-msp430" }
remu-cpu-pic16 = { path = "crates/remu-cpu-pic16" }
remu-cpu-riscv = { path = "crates/remu-cpu-riscv" }
remu-cpu-xtensa = { path = "crates/remu-cpu-xtensa" }
remu-devices = { path = "crates/remu-devices" }
remu-gdb = { path = "crates/remu-gdb" }
remu-image = { path = "crates/remu-image" }
remu-machines = { path = "crates/remu-machines" }
remu-signals = { path = "crates/remu-signals" }
remu-trace = { path = "crates/remu-trace" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
starlark = "0.14.2"
tempfile = "3.21.0"
thiserror = "2.0.16"
toml = "0.9.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
