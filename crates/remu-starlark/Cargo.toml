[package]
name = "remu-starlark"
description = "Bounded Starlark assertions and declarative board assembly for Renvo Emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
allocative.workspace = true
anyhow = "1.0.100"
remu-core.workspace = true
remu-bus.workspace = true
remu-devices.workspace = true
remu-machines.workspace = true
remu-radio.workspace = true
remu-signals.workspace = true
serde.workspace = true
serde_json.workspace = true
starlark.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# Starlark's custom-value macros generate the required unsafe marker-trait impls.
# This crate contains no handwritten unsafe blocks.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unnecessary_wraps = "allow"
