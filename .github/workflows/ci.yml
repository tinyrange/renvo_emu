name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Check source layout
        run: ./scripts/check-source-layout.sh

      - name: Check package manifests
        run: cargo package --workspace --locked --allow-dirty --no-verify --list >/dev/null

      - name: Check generated capability matrix
        run: |
          cargo build --locked -p remu-cli
          scripts/check-capability-matrix.sh
