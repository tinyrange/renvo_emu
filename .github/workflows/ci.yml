name: CI

on:
  push:
    branches: [main, esp32s3, esp32c6-omnibus]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build WASI browser component
        run: cargo build --release -p remu-web --target wasm32-wasip2 --locked

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Test WASI JavaScript component
        working-directory: web
        run: npm run test:component

      - name: Build browser bundle
        working-directory: web
        run: npm run transpile && npm run build:site

      - name: Check source layout
        run: ./scripts/check-source-layout.sh

      - name: Check package manifests
        run: cargo package --workspace --locked --allow-dirty --no-verify --list >/dev/null

  esp32s3-vendor:
    name: ESP32-S3 vendor and M5StickS3 qualification
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Build pinned Espressif GCC image
        run: docker build --tag remu/xtensa-esp-gcc:local toolchains/xtensa-esp-gcc

      - name: Run native peripheral qualification
        run: ./scripts/qualify-esp32s3-peripherals.sh

      - name: Run ESP-IDF and TinyUSB stack qualification
        run: ./scripts/qualify-esp32s3-usb-stacks.sh

      - name: Run M5StickS3 firmware/component qualification
        run: ./scripts/qualify-board-models.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: esp32s3-peripheral-qualification
          path: |
            .remu/qualification/esp32s3-peripherals
            .remu/qualification/esp32s3-usb-stacks
            .remu/qualification/board-models
          if-no-files-found: ignore

  esp32c6-vendor:
    name: ESP32-C6 vendor peripheral qualification
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Build pinned Espressif RISC-V GCC image
        run: docker build --tag remu/riscv32-esp-gcc:local toolchains/riscv32-esp-gcc

      - name: Run native peripheral qualification
        run: ./scripts/qualify-esp32c6-peripherals.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: esp32c6-peripheral-qualification
          path: .remu/qualification/esp32c6-peripherals
          if-no-files-found: ignore
