[package]
name = "remu-rust-abi"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = false
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(remu_wch)",
    "cfg(remu_esp32c6)",
    "cfg(remu_rp2040)",
    "cfg(remu_rp2350_arm)",
    "cfg(remu_rp2350_riscv)",
] }
